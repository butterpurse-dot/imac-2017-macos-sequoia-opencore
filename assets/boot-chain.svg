<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 170" width="820" height="170" role="img" aria-label="Boot chain: Mac firmware loads OpenCore from the T7's EFI partition, OpenCore presents the Mac as an iMac19,1, then macOS Sequoia boots">
  <style>
    .bg { fill: #0d1117; }
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e6edf3; }
    .s { fill: #8b949e; font-size: 11px; }
    .box { fill: #161b22; stroke: #30363d; stroke-width: 2; }
    .wire { stroke: #30363d; stroke-width: 3; fill: none; }
    .flow { stroke: #2f81f7; stroke-width: 3; fill: none; stroke-dasharray: 600; stroke-dashoffset: 600; animation: flow 5s linear infinite; }
    .n1 { animation: lit 5s infinite; animation-delay: 0s; }
    .n2 { animation: lit 5s infinite; animation-delay: 1s; }
    .n3 { animation: lit 5s infinite; animation-delay: 2s; }
    .n4 { animation: lit 5s infinite; animation-delay: 3s; }
    @keyframes flow { 0% { stroke-dashoffset: 600 } 70%,100% { stroke-dashoffset: 0 } }
    @keyframes lit { 0% { stroke: #30363d } 5%,60% { stroke: #2f81f7 } 75%,100% { stroke: #30363d } }
  </style>
  <rect class="bg" width="820" height="170" rx="14"/>
  <path class="wire" d="M180 75 H230 M410 75 H460 M640 75 H660"/>
  <path class="flow" d="M100 75 H760"/>

  <rect class="box n1" x="20"  y="40" width="160" height="70" rx="10"/>
  <text class="t" x="100" y="72" text-anchor="middle" font-size="15">⏻ power on</text>
  <text class="t s" x="100" y="94" text-anchor="middle">Mac firmware</text>

  <rect class="box n2" x="230" y="40" width="180" height="70" rx="10"/>
  <text class="t" x="320" y="72" text-anchor="middle" font-size="15">OpenCore 1.0.6</text>
  <text class="t s" x="320" y="94" text-anchor="middle">on T7's EFI · 10s picker</text>

  <rect class="box n3" x="460" y="40" width="180" height="70" rx="10"/>
  <text class="t" x="550" y="72" text-anchor="middle" font-size="15">"I'm an iMac19,1"</text>
  <text class="t s" x="550" y="94" text-anchor="middle">SMBIOS spoof + kexts</text>

  <rect class="box n4" x="660" y="40" width="140" height="70" rx="10"/>
  <text class="t" x="730" y="72" text-anchor="middle" font-size="15" fill="#7ee787">Sequoia 🎉</text>
  <text class="t s" x="730" y="94" text-anchor="middle">15.8.1 (24H32)</text>

  <text class="t s" x="410" y="145" text-anchor="middle">no USB stick needed after install · T7 stays the default boot disk</text>
</svg>
