<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="820" height="200" role="img" aria-label="Background services switching off: Siri, News, Weather, Photos analysis, Tips, Game Center, Suggestions, App Store promos">
  <style>
    .bg { fill: #0d1117; }
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e6edf3; font-size: 14px; }
    .d { fill: #8b949e; font-size: 12px; }
    .track { animation: track 8s infinite; }
    .knob { animation: knob 8s infinite; }
    .a { animation-delay: 0s } .b { animation-delay: .3s } .c { animation-delay: .6s } .e { animation-delay: .9s }
    .f { animation-delay: 1.2s } .g { animation-delay: 1.5s } .h { animation-delay: 1.8s } .i { animation-delay: 2.1s }
    @keyframes track { 0%,10% { fill: #238636 } 18%,85% { fill: #30363d } 95%,100% { fill: #238636 } }
    @keyframes knob  { 0%,10% { transform: translateX(16px) } 18%,85% { transform: translateX(0) } 95%,100% { transform: translateX(16px) } }
  </style>
  <rect class="bg" width="820" height="200" rx="14"/>
  <text class="t" x="24" y="34" font-weight="700">background bloat → off</text>
  <text class="t d" x="796" y="34" text-anchor="end">launchctl disable gui/$UID/… · reversible</text>

  <g transform="translate(24,60)">
    <g><rect class="track a" width="36" height="20" rx="10"/><circle class="knob a" cx="10" cy="10" r="8" fill="#e6edf3"/><text class="t" x="48" y="15">Siri</text></g>
    <g transform="translate(200,0)"><rect class="track b" width="36" height="20" rx="10"/><circle class="knob b" cx="10" cy="10" r="8" fill="#e6edf3"/><text class="t" x="48" y="15">News</text></g>
    <g transform="translate(400,0)"><rect class="track c" width="36" height="20" rx="10"/><circle class="knob c" cx="10" cy="10" r="8" fill="#e6edf3"/><text class="t" x="48" y="15">Weather</text></g>
    <g transform="translate(600,0)"><rect class="track e" width="36" height="20" rx="10"/><circle class="knob e" cx="10" cy="10" r="8" fill="#e6edf3"/><text class="t" x="48" y="15">Photo analysis</text></g>
    <g transform="translate(0,50)"><rect class="track f" width="36" height="20" rx="10"/><circle class="knob f" cx="10" cy="10" r="8" fill="#e6edf3"/><text class="t" x="48" y="15">Tips</text></g>
    <g transform="translate(200,50)"><rect class="track g" width="36" height="20" rx="10"/><circle class="knob g" cx="10" cy="10" r="8" fill="#e6edf3"/><text class="t" x="48" y="15">Game Center</text></g>
    <g transform="translate(400,50)"><rect class="track h" width="36" height="20" rx="10"/><circle class="knob h" cx="10" cy="10" r="8" fill="#e6edf3"/><text class="t" x="48" y="15">Suggestions</text></g>
    <g transform="translate(600,50)"><rect class="track i" width="36" height="20" rx="10"/><circle class="knob i" cx="10" cy="10" r="8" fill="#e6edf3"/><text class="t" x="48" y="15">App Store promos</text></g>
  </g>
  <text class="t d" x="24" y="180">+ orphaned Docker / Adobe / Teams / Google updaters removed · widgets cleared · transparency off</text>
</svg>
