<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260" role="img" aria-label="2017 iMac going from macOS Ventura 13 to macOS Sequoia 15">
  <style>
    .bg { fill: #0d1117; }
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e6edf3; }
    .dim { fill: #8b949e; }
    .old { animation: old 6s ease-in-out infinite; }
    .new { animation: new 6s ease-in-out infinite; opacity: 0; }
    .bar { animation: fill 6s ease-in-out infinite; transform-origin: 0 0; transform: scaleX(0); }
    .glow { animation: glow 6s ease-in-out infinite; }
    .apple { animation: pulse 1.2s ease-in-out infinite; transform-origin: 160px 105px; }
    .stamp { animation: stamp 6s ease-in-out infinite; opacity: 0; transform-origin: 600px 205px; }
    @keyframes old  { 0%,30% { opacity: 1 } 40%,90% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes new  { 0%,40% { opacity: 0 } 50%,90% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes fill { 0% { transform: scaleX(0) } 40% { transform: scaleX(1) } 90% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
    @keyframes glow { 0%,40% { fill: #161b22 } 50%,90% { fill: #1f2d3d } 100% { fill: #161b22 } }
    @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.12) } }
    @keyframes stamp { 0%,50% { opacity: 0; transform: scale(1.6) rotate(-8deg) } 56%,90% { opacity: 1; transform: scale(1) rotate(-8deg) } 100% { opacity: 0 } }
  </style>
  <rect class="bg" width="820" height="260" rx="14"/>

  <!-- iMac -->
  <rect x="40" y="30" width="240" height="150" rx="8" fill="#30363d"/>
  <rect class="glow" x="50" y="40" width="220" height="125" rx="3"/>
  <rect x="40" y="165" width="240" height="22" rx="0" fill="#c9d1d9"/>
  <path d="M135 187 h50 l10 38 h-70 z" fill="#8b949e"/>
  <rect x="115" y="225" width="90" height="6" rx="3" fill="#8b949e"/>
  <g class="apple">
    <path d="M160 92c3-4 8-5 8-5s0 5-3 8c-3 3-7 3-7 3s-1-3 2-6zM151 101c4 0 6 2 9 2s5-2 9-2c3 0 7 2 9 6-8 4-7 15 1 18-2 6-6 12-10 12-3 0-4-2-8-2s-5 2-8 2c-5 0-12-11-12-21 0-10 6-15 10-15z" fill="#e6edf3" transform="translate(0,-14) scale(1)"/>
  </g>
  <text class="t old" x="160" y="150" text-anchor="middle" font-size="13">Ventura 13</text>
  <text class="t new" x="160" y="150" text-anchor="middle" font-size="13" fill="#7ee787">Sequoia 15</text>

  <!-- right side -->
  <text class="t" x="320" y="62" font-size="24" font-weight="700">2017 iMac → macOS Sequoia</text>
  <text class="t dim" x="320" y="90" font-size="14">Apple stopped at Ventura. OpenCore Legacy Patcher didn't.</text>

  <rect x="320" y="120" width="460" height="16" rx="8" fill="#21262d"/>
  <rect class="bar" x="320" y="120" width="460" height="16" rx="8" fill="#2f81f7"/>
  <text class="t dim" x="320" y="160" font-size="12">internal drive or external SSD · OpenCore on its EFI</text>

  <g class="stamp">
    <rect x="530" y="185" width="140" height="38" rx="6" fill="none" stroke="#7ee787" stroke-width="3"/>
    <text class="t" x="600" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#7ee787">UPGRADED</text>
  </g>
</svg>
