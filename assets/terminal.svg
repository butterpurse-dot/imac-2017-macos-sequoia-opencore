<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" width="820" height="230" role="img" aria-label="Terminal replay: syncing OpenCore to the T7, spoofing iMac19,1, then sw_vers reports macOS 15.8.1">
  <style>
