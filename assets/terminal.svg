    .p { fill: #7ee787; }
    .ok { fill: #7ee787; }
    .d { fill: #8b949e; }
    .l { opacity: 0; }
    .l1 { animation: s1 12s infinite; } .l2 { animation: s2 12s infinite; } .l3 { animation: s3 12s infinite; }
    .l4 { animation: s4 12s infinite; } .l5 { animation: s5 12s infinite; } .l6 { animation: s6 12s infinite; }
    .l7 { animation: s7 12s infinite; } .l8 { animation: s8 12s infinite; }
    @keyframes s1 { 0%,2% { opacity: 0 } 3%,95% { opacity: 1 } 96%,100% { opacity: 0 } }
    @keyframes s2 { 0%,12% { opacity: 0 } 13%,95% { opacity: 1 } 96%,100% { opacity: 0 } }
    @keyframes s3 { 0%,22% { opacity: 0 } 23%,95% { opacity: 1 } 96%,100% { opacity: 0 } }
    @keyframes s4 { 0%,32% { opacity: 0 } 33%,95% { opacity: 1 } 96%,100% { opacity: 0 } }
    @keyframes s5 { 0%,42% { opacity: 0 } 43%,95% { opacity: 1 } 96%,100% { opacity: 0 } }
    @keyframes s6 { 0%,57% { opacity: 0 } 58%,95% { opacity: 1 } 96%,100% { opacity: 0 } }
    @keyframes s7 { 0%,64% { opacity: 0 } 65%,95% { opacity: 1 } 96%,100% { opacity: 0 } }
    @keyframes s8 { 0%,70% { opacity: 0 } 71%,78%,86%,94% { opacity: 1 } 74%,82%,90% { opacity: 0 } 96%,100% { opacity: 0 } }
  </style>
  <rect class="bg" width="820" height="230" rx="12"/>
  <rect class="bar" width="820" height="30" rx="12"/>
  <rect class="bar" y="18" width="820" height="12"/>
  <circle cx="22" cy="15" r="6" fill="#ff5f57"/><circle cx="42" cy="15" r="6" fill="#febc2e"/><circle cx="62" cy="15" r="6" fill="#28c840"/>
  <text class="t d" x="410" y="20" text-anchor="middle" font-size="12">zsh — the whole saga in 8 lines</text>

  <g>
    <text class="t l l1" x="20" y="58"><tspan class="p">❯</tspan> bash scripts/sync-oc-to-t7.sh</text>
    <text class="t l l2" x="20" y="80"><tspan class="ok">RESULT: OK</tspan><tspan class="d">, the T7 now has the Sequoia-ready OpenCore</tspan></text>
    <text class="t l l3" x="20" y="106"><tspan class="p">❯</tspan> bash scripts/spoof-smbios.sh</text>
    <text class="t l l4" x="20" y="128"><tspan class="d">Model 'iMac18,2' → </tspan>'iMac19,1'  <tspan class="ok">RESULT: OK</tspan></text>
    <text class="t l l5" x="20" y="154"><tspan class="p">❯</tspan> open "/Applications/Install macOS Sequoia.app"  <tspan class="d"># ☕ ~1 h</tspan></text>
    <text class="t l l6" x="20" y="180"><tspan class="p">❯</tspan> sw_vers -productVersion</text>
    <text class="t l l7" x="20" y="202"><tspan class="ok">15.8.1</tspan>  🎉</text>
    <text class="t l l8" x="20" y="222"><tspan class="p">❯</tspan> ▍</text>
  </g>
</svg>
